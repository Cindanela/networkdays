name: networkdays
description: >-
  Calculate working days between two dates, following Excel NETWORKDAYS /
  NETWORKDAYS.INTL semantics. Supports custom weekend definitions, holidays,
  and returns lists of working-day DateTime values.
version: 0.0.1
homepage: https://github.com/Cindanela/networkdays
repository: https://github.com/Cindanela/networkdays
license: MIT

topics:
  - workdays
  - calendar
  - datetime

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
